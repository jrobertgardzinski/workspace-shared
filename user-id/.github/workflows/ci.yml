name: CI

# Self-contained (no dependencies), so it builds and tests on its own. The reactor CI in the
# aggregator repo validates it with every consumer.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
