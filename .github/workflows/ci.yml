name: CI

# The SHARED KERNEL: identity + channels + every shared library, one repository since 2026-11-06.
# The sub-projects are directories here, so one checkout is the whole kernel and the reactor
# builds and tests everything in dependency order with one command.
#
# The two PRODUCTS have their own repositories and CIs (workspace-portal, workspace-formula);
# they consume this kernel through ~/.m2, so nothing product-flavoured builds here.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  reactor:
    runs-on: ubuntu-latest
    # the same ceiling and the same reasoning as portal/ci.yml: a wedged build must not sit here
    # for six hours. Added on 2026-07-29 — the timeouts had been applied selectively.
    timeout-minutes: 30
    steps:
      - name: Checkout the kernel
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test the shared kernel
        run: ./mvnw -B --no-transfer-progress clean install

  # The same Gherkin specs, driven through a real browser (cucumber-js + Playwright) against
  # the security service and its React UI. Only the modules the security jar needs are built
  # (-am closure), tests skipped — the reactor job owns those.
  # The three Python services had suites that passed and that NOTHING ran: this workflow checked out
  # eleven Java repositories and never these, and its only run: steps were Maven, npm and Playwright.
  # A regression in the stub IdP or in either notification channel sailed through a green build — and
  # those are the services carrying the OIDC dance and the MFA code delivery. Stdlib unittest, so the
  # job needs no dependencies at all and costs seconds.
  python-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stub IdP — the OIDC dance, the header-splitting guard and the code store's ceiling
        run: python -m unittest -v
        working-directory: microservice-idp
      - name: SMS channel — validation, the API key, and what the log may not carry
        run: python -m unittest -v
        working-directory: microservice-sms
      - name: Push channel — the same, for the other notification adapter
        run: python -m unittest -v
        working-directory: microservice-push

  e2e:
    runs-on: ubuntu-latest
    # the browser suite stands a real stack up; 60 is the honest ceiling, as in portal/ci.yml
    timeout-minutes: 60
    steps:
      - name: Checkout the kernel
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the security jar (deps closure, no tests)
        run: ./mvnw -B -q --no-transfer-progress -pl microservice-security/security-infrastructure -am package -DskipTests

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: microservice-security/security-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: microservice-security/security-ui
      # Cheap and first: the error model is pure decision-making ("what does this status mean to a
      # person?") and every one of its rules used to be an unwritten else that told users their
      # password was wrong when the database was down. No browser, no stack — seconds.
      - name: Unit-test the UI's error model (security-ui)
        run: npm test
        working-directory: microservice-security/security-ui
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: microservice-security/security-ui
      - name: Drive the shared specs through the browser (security-ui)
        run: ./run-e2e.sh
        working-directory: microservice-security/security-ui
      - name: Upload service/UI logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: /tmp/*-e2e-*.log
